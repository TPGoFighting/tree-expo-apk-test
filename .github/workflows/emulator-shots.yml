name: tree-expo APK emulator screenshots

# Test-only repo: installs the tree-expo APK (Expo SDK 58, package
# top.tpgofighting.tree) on a GitHub-hosted Android emulator and captures
# screenshots. The APK is downloaded from its public preview URL at run time
# — it is NOT committed to this repo.
# APK: https://tpgofighting.top/preview/tree-expo/app.apk (124,308,733 bytes)

on:
  push:
  workflow_dispatch:

jobs:
  emulator-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        run: |
          curl --fail -L -o app.apk https://tpgofighting.top/preview/tree-expo/app.apk
          SIZE=$(stat -c%s app.apk)
          echo "APK size: $SIZE"
          if [ "$SIZE" != "124308733" ]; then
            echo "ERROR: unexpected APK size $SIZE (expected 124308733)"
            exit 1
          fi

      - name: Install and screenshot on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # NOTE: this action executes EACH LINE of `script` as a separate
          # `/usr/bin/sh -c` invocation, so shell variables and functions do
          # NOT persist between lines (run 1 lesson). All logic lives in
          # scripts/run-shots.sh; this block is a single call to it.
          # Run 3: waits for System UI to settle, taps "Wait" on any ANR
          # dialog (coordinates parsed from the UI dump), screenshots the
          # home screen twice (15 s / 30 s after launch).
          script: bash scripts/run-shots.sh

      - name: Upload screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tree-expo-shots
          path: |
            tree-home-15s.png
            tree-home-30s.png
            tree-me.png
            tree-back.png
            logcat.txt
            ui-last.xml
          if-no-files-found: warn
